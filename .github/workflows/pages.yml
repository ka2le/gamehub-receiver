name: Publish TV receiver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check receiver protocol
        run: node --test protocol.test.mjs
      - name: Stage public receiver files
        run: |
          mkdir public
          cp index.html receiver.css receiver.mjs protocol.mjs logo.svg quiz-art.svg public/
          cp -R fonts public/fonts
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy receiver
        id: deployment
        uses: actions/deploy-pages@v4
